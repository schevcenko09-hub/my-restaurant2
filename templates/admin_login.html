

{% extends "base.html" %}

{% block title %}
VYBE — Адмін
{% endblock %}

{% block content %}

<section class="auth-page admin-auth-page">

    <div class="auth-box">

        <p class="hero-small">
            VYBE ADMIN
        </p>

        <h1>
            Вхід до адмін-панелі
        </h1>

        <p>
            Авторизуйтесь для керування рестораном.
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">
                Пароль
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button
                type="submit"
                class="button"
            >
                Увійти
            </button>

        </form>

    </div>

</section>

{% endblock %}
