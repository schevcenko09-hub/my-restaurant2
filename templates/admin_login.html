
```html
{% extends "base.html" %}

{% block title %}
VYBE — Вхід адміністратора
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-box">

        <h1>Вхід адміністратора</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="button">
                Увійти
            </button>

        </form>

        <a href="{{ url_for('menu') }}">
            Повернутися до меню
        </a>

    </div>

</section>

{% endblock %}
```
