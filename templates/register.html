
{% extends "base.html" %}

{% block title %}
VYBE — Реєстрація
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-box">

        <p class="hero-small">
            VYBE
        </p>

        <h1>
            Реєстрація
        </h1>

        <p>
            Створіть акаунт, щоб замовляти онлайн.
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="name">
                Ім'я
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Ваше ім'я"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="your@email.com"
                required
            >

            <label for="password">
                Пароль
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Мінімум 8 символів"
                required
            >

            <label for="password2">
                Повторіть пароль
            </label>

            <input
                type="password"
                id="password2"
                name="password2"
                placeholder="Повторіть пароль"
                required
            >

            <button
                type="submit"
                class="button"
            >
                Зареєструватися
            </button>

        </form>

        <p class="auth-link">
            Вже маєте акаунт?
            <a href="{{ url_for('login') }}">
                Увійти
            </a>
        </p>

    </div>

</section>

{% endblock %}
