
{% extends "base.html" %}

{% block title %}
VYBE — Вхід
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <p class="hero-small">
                VYBE RESTAURANT
            </p>

            <h1>
                Вхід
            </h1>

            <p>
                Увійдіть до свого акаунта
            </p>

        </div>


        {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введіть пароль"
                    required
                >

            </div>


            <button
                type="submit"
                class="button auth-button"
            >
                Увійти
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Ще немає акаунта?
            </p>

            <a
                href="{{ url_for('register') }}"
                class="auth-link"
            >
                Зареєструватися
            </a>

        </div>

    </div>

</section>

{% endblock %}
