
{% extends "base.html" %}

{% block title %}
VYBE — Вхід
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-box">

        <p class="hero-small">
            VYBE
        </p>

        <h1>
            Вхід
        </h1>

        <p>
            Увійдіть до свого акаунта.
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="your@email.com"
                required
            >

            <label for="password">
                Пароль
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ваш пароль"
                required
            >

            <button
                type="submit"
                class="button"
            >
                Увійти
            </button>

        </form>

        <p class="auth-link">
            Ще немає акаунта?
            <a href="{{ url_for('register') }}">
                Зареєструватися
            </a>
        </p>

    </div>

</section>

{% endblock %}
