
{% extends "base.html" %}

{% block title %}
VYBE — Вибір входу
{% endblock %}

{% block content %}

<div class="container">

    <div
        class="row justify-content-center align-items-center"
        style="min-height: calc(100vh - 76px);"
    >

        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <div
                class="card border-0 shadow-lg"
                style="
                    background: #fffaf4;
                    border-radius: 22px;
                    overflow: hidden;
                "
            >

                <div class="card-body p-4 p-md-5 text-center">

                    <div
                        style="
                            color: #701f1f;
                            font-size: 13px;
                            font-weight: 700;
                            letter-spacing: 5px;
                            margin-bottom: 12px;
                        "
                    >
                        VYBE
                    </div>


                    <h1
                        style="
                            color: #292724;
                            font-weight: 700;
                            margin-bottom: 10px;
                        "
                    >
                        Вітаємо
                    </h1>


                    <p
                        style="
                            color: #716a63;
                            margin-bottom: 30px;
                        "
                    >
                        Оберіть, як ви хочете увійти
                    </p>


                    <!-- =========================
                         АДМІН
                    ========================== -->

                    <form
                        action="{{ url_for('choose_role') }}"
                        method="POST"
                        class="mb-3"
                    >

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <input
                            type="hidden"
                            name="role"
                            value="admin"
                        >

                        <button
                            type="submit"
                            class="btn w-100 py-3"
                            style="
                                background: #701f1f;
                                color: #fffaf4;
                                border: none;
                                border-radius: 12px;
                                font-size: 16px;
                                font-weight: 600;
                            "
                        >
                            👑 Увійти як адміністратор
                        </button>

                    </form>


                    <!-- =========================
                         КОРИСТУВАЧ
                    ========================== -->

                    <form
                        action="{{ url_for('choose_role') }}"
                        method="POST"
                    >

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <input
                            type="hidden"
                            name="role"
                            value="user"
                        >

                        <button
                            type="submit"
                            class="btn btn-outline-dark w-100 py-3"
                            style="
                                border-radius: 12px;
                                font-size: 16px;
                                font-weight: 600;
                            "
                        >
                            👤 Увійти як користувач
                        </button>

                    </form>


                    <div class="mt-4">

                        <a
                            href="{{ url_for('login') }}"
                            style="
                                color: #716a63;
                                text-decoration: none;
                                font-size: 14px;
                            "
                        >
                            ← Повернутися до входу
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
