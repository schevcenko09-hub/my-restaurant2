
{% extends "base.html" %}

{% block title %}
VYBE — Помилка
{% endblock %}

{% block content %}

<section class="error-page">

    <div class="error-box">

        <span class="error-code">
            {{ error_code }}
        </span>

        <h1>
            Щось пішло не так
        </h1>

        <p>
            {{ error_message }}
        </p>

        <div class="error-actions">

            <a
                href="{{ url_for('index') }}"
                class="button"
            >
                На головну
            </a>

            <a
                href="{{ url_for('menu') }}"
                class="button button-light"
            >
                До меню
            </a>

        </div>

    </div>

</section>

{% endblock %}
