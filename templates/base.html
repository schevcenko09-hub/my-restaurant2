

<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        VYBE
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

</head>

<body>

<header>

    <nav>

        <!-- Логотип / Головна -->
        <a href="{{ url_for('index') }}">
            VYBE
        </a>

        <a href="{{ url_for('index') }}">
    Головна
        </a>

        <!-- Меню -->
        <a href="{{ url_for('menu') }}">
            Меню
        </a>


        {% if session.get("is_admin") %}

            

            <a href="{{ url_for('admin') }}">
                Адмін-панель
            </a>

            

            <a href="{{ url_for('admin_logout') }}">
                Вийти з адмінки
            </a>


        {% elif session.get("user_id") %}

            <!-- ========================= -->
            <!-- НАВІГАЦІЯ КОРИСТУВАЧА -->
            <!-- ========================= -->

            <a href="{{ url_for('cart') }}">
                Кошик
            </a>

            <a href="{{ url_for('orders') }}">
                Мої замовлення
            </a>

            <a href="{{ url_for('profile') }}">
                Профіль
            </a>

            <a href="{{ url_for('logout') }}">
                Вийти
            </a>


        {% else %}

            <!-- ========================= -->
            <!-- НЕАВТОРИЗОВАНИЙ КОРИСТУВАЧ -->
            <!-- ========================= -->

            <a href="{{ url_for('login') }}">
                Увійти
            </a>

            <a href="{{ url_for('register') }}">
                Реєстрація
            </a>

        {% endif %}

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
