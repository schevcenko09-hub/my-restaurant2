

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}VYBE{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

    <style>
        

        .vybe-header {
            height: 72px;
            background: #292724;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        }

        .vybe-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .vybe-logo {
            text-decoration: none;
            color: #fffaf4;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 4px;
            transition: 0.25s ease;
        }

        .vybe-logo:hover {
            color: #f4d7a1;
        }

        .vybe-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vybe-nav a,
        .vybe-nav button {
            text-decoration: none;
            color: #fffaf4;
            background: transparent;
            border: none;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.25s ease;
            cursor: pointer;
        }

        .vybe-nav a:hover,
        .vybe-nav button:hover {
            background: #701f1f;
            color: #fff;
        }

        .admin-nav-link {
            color: #f4d7a1 !important;
        }

        .admin-nav-link:hover {
            background: #f4d7a1 !important;
            color: #292724 !important;
        }

        .vybe-header-form {
            margin: 0;
        }

        

        @media (max-width: 768px) {
            .vybe-header {
                height: 64px;
            }

            .vybe-logo {
                font-size: 21px;
                letter-spacing: 3px;
            }

            .vybe-nav {
                gap: 2px;
            }

            .vybe-nav a,
            .vybe-nav button {
                padding: 7px 8px;
                font-size: 12px;
            }
        }

        @media (max-width: 500px) {
            .vybe-logo {
                font-size: 19px;
            }

            .vybe-nav a,
            .vybe-nav button {
                font-size: 11px;
                padding: 6px;
            }
        }
    </style>
</head>

<body>

<header class="vybe-header">
    <div class="container">

        <a href="{{ url_for('index') }}" class="vybe-logo">
            VYBE
        </a>

        <nav class="vybe-nav">

   

    <a href="{{ url_for('index') }}">
        Головна
    </a>


    

    <a href="{{ url_for('menu') }}">
        Меню
    </a>


    

    {% if not session.get("user_id") and not session.get("is_admin") %}

        <a href="{{ url_for('login') }}">
            Увійти
        </a>

        <a href="{{ url_for('register') }}">
            Реєстрація
        </a>

    {% endif %}


    
    {% if session.get("user_id") %}

        <a href="{{ url_for('cart') }}">
            Кошик
        </a>

        <a href="{{ url_for('orders') }}">
            Замовлення
        </a>

        <a href="{{ url_for('profile') }}">
            Профіль
        </a>


        

        <a
            href="{{ url_for('admin_login') }}"
            class="admin-nav-link"
        >
            👑 Адмін-панель
        </a>


        

        <form
            action="{{ url_for('logout') }}"
            method="POST"
            class="vybe-header-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <button type="submit">
                Вийти
            </button>

        </form>

    {% endif %}


   

    {% if session.get("is_admin") %}

        <a
            href="{{ url_for('admin') }}"
            class="admin-nav-link"
        >
            👑 Адмін-панель
        </a>


        <form
            action="{{ url_for('admin_logout') }}"
            method="POST"
            class="vybe-header-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <button type="submit">
                Вийти
            </button>

        </form>

    {% endif %}

</nav>

    </div>
</header>


<main>
    {% block content %}
    {% endblock %}
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
